[tool.pytest.ini_options]
addopts = "-ra --strict-markers --basetemp=.pytest-temp -p no:cacheprovider"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["tools/corporate_events/phase2.py", "tools/corporate_events/sec_census.py", "tests/test_corporate_event_phase2.py", "tests/test_sec_acquisition.py", "tools/corporate_events/event_parsers.py", "tools/corporate_events/sec_document_client.py", "tools/corporate_events/parser_qa.py", "tests/test_event_parsers.py", "tests/test_parser_qa.py"]
