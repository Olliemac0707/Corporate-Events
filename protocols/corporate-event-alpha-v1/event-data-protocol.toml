activist = "INITIAL_13D plus ACTIVIST_INTENT_SUPPORTED from original public Item4; no additional ownership cutoff"
dividend = "DIVIDEND_INITIATION with positive initiation/prehistory evidence, or comparable ordinary DIVIDEND_INCREASE with prior public baseline, or explicitly SPECIAL_DIVIDEND; no minimum increase; missing is not initiation"
spinoff = "SPINOFF_INTENTION evidenced as intended spin-off/separation structure, not review/sale/IPO/split-off/completion; first registered public disclosure must be supported or unresolved"
mapping = "SEC-described class evidence is separate from Phase3 vendor mapping; vendor mapping remains NULL and cannot delete an event"
final_ledger = "Phase2 freeze must audit family facts, reviews and evidence before certifying qualifying/rejection ledgers; SQL is a storage schema, not an automatic event classifier"

[acceptance_normalization]
sgml_rule = "Normalize 14-digit local SGML only after source-specific America/New_York semantics independently verified; reject ambiguous/nonexistent local times"
structured_rule = "Preserve supplied timezone/offset and raw bytes; do not route JSON Z timestamps through SGML local-time parser or relabel without source verification"
unknown = "Retain raw acceptance; normalized fields NULL and TIMESTAMP_UNRESOLVED as appropriate; acceptance never proves dissemination"

