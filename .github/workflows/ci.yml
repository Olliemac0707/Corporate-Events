name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-validation:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - name: Preserve hash-pinned source bytes
        run: git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.12"
      - name: Install development tools
        run: python -m pip install -r requirements-dev.txt
      - name: Validate frozen protocol
        run: python -I -S -B tools/corporate_events/phase2.py validate
      - name: Run offline synthetic demo
        run: python tools/corporate_events/demo.py
      - name: Run tests
        run: python -m pytest -q
      - name: Lint
        run: python -m ruff check tools tests
      - name: Type check
        run: python -m mypy tools/corporate_events tests

